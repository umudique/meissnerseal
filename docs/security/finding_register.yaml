  - id: F-130
    kind: coverage_gap
    component: test-vectors
    source: "test vector review — test-vectors/mlkem_768_kat_v1.json + mlkem_cross_verify.py (2026-07-04)"
    date: 2026-07-04
    description: >-
      mlkem_cross_verify.py verify_format() (L59-73) performs shallow
      validation in offline mode. Four gaps:
      (1) Length-only hex check: validates only that len(v.get("ek","")) ==
      expected hex char count. A string of the correct length but containing
      non-hex characters (e.g. spaces, punctuation) passes without error.
      (2) No uppercase enforcement: fields are checked for length but not
      for uppercase-only hex. A lowercase hex value passes verify_format().
      The docstring states "upper-case hex" as a required invariant (L7)
      but the function does not assert it.
      (3) No exact tcId set assertion: load_local() returns all vectors
      from the file as a dict keyed by tcId. verify_format() iterates over
      whatever keys are present. If the file contains extra tcIds not in
      TC_IDS = {26,27,28} (e.g. from a partial upstream update), they are
      validated but not flagged as unexpected. In offline mode the set of
      tcIds present is never compared against TC_IDS.
      (4) Silent duplicate tcId: load_local() uses a dict comprehension
      {v["tcId"]: v for v in data["vectors"]}. If two entries share the
      same tcId the second silently overwrites the first. Neither
      load_local() nor verify_format() signals this condition.
