      a different info string would not be detected by the verifier since
      the verifier always uses its own constant. The JSON has no
      hkdf_info field to anchor this binding.
      (6) No algorithm ID mismatch case: profile field is not asserted by
      the verifier's main() (L101-106), which reads data["cases"] without
