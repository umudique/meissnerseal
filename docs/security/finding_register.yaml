    cwe: "CWE-20"
    severity: medium
    blocking: true
    status: resolved
    remediation: >-
      Pass wrk_frame_end and the sealed-table section end into
      open_sealed_record_table_v2, then reject entries whose frame spans
      overlap the WRK frame region, the sealed-table region, or any
      previously validated entry region. Reject duplicate live record IDs
      in the authenticated entry set.
    verification: >-
      Add sealed-table negative vectors for frame_offset inside the WRK
      frame body, frame_offset inside the sealed table section,
      overlapping item frames, duplicate record IDs, and frame bounds
      that exactly touch each protected section.
    commit: "ea67426"

