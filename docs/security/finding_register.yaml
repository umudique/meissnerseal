  - id: F-131
    kind: coverage_gap
    component: test-vectors
    source: "test vector review — test-vectors/mlkem_768_kat_v1.json (2026-07-04)"
    date: 2026-07-04
    description: >-
      mlkem_768_kat_v1.json contains three positive decapsulation KATs
      (tcIds 26-28). No vector covers the ML-KEM implicit rejection
      security property defined in FIPS 203 §6.3: when a ciphertext is
      invalid or tampered, ML-KEM.Decaps must return a pseudorandom key
      K' (derived from a hidden implicit rejection value z) rather than
      signalling a decapsulation failure. This "implicit rejection" design
      prevents chosen-ciphertext oracle attacks: a caller that observes
      only Ok(K) vs Err gains no information about ciphertext validity.
      Two specific gaps:
      (1) No "tampered ciphertext → pseudorandom output" vector: no JSON
      case records a tampered ciphertext c' together with the expected
      pseudorandom output K' that results from decapsulate(dk, c'). A
      test that simply asserts K' != K is incomplete because it does not
      pin K' to a reference value; an implementation that returns a random
      K' on every call would pass such a test.
      (2) API contract not verified: it is unconfirmed whether the
      meissnerseal-pqc decapsulate() Rust API returns Ok(K') or Err for
      a tampered ciphertext. If the crate returns Err, it acts as an
      error oracle — a violation of the FIPS 203 implicit rejection
      requirement and a potential CCA2 attack surface. F-55 (resolved)
      added encapsulate() adversarial-key tests and NIST KAT integration,
      but did not add a test that asserts Ok(K') (not Err) for a tampered
      ciphertext with K' pinned to a reference value.
    cwe: "CWE-203"
    severity: medium
    blocking: false
    status: resolved
    remediation: >-
      Add one negative/implicit-rejection vector to mlkem_768_kat_v1.json:
      take tcId=26, flip one byte of c (e.g. byte 0 XOR 0x01) to produce
      c_tampered, run the reference ML-KEM implementation to obtain
      K_implicit = ML-KEM.Decaps(dk, c_tampered), record both c_tampered
      and K_implicit in the vector. Add a Rust test
      nist_kat_implicit_rejection that: (a) calls decapsulate(dk,
      c_tampered), (b) asserts the result is Ok (not Err) — confirming no
      error oracle, (c) asserts the returned key equals K_implicit —
      pinning the pseudorandom output to the reference value, (d) asserts
      the returned key != K (authentic key from same tcId). If decapsulate()
      currently returns Err for tampered input, the API must be corrected
      before adding the test.
    verification: >-
      mlkem_768_kat_v1.json val_group (tgId=5, ML-KEM-768) contains 5
      "modify ciphertext" cases and 5 "no modification" cases sourced
      from NIST ACVP internalProjection.json (pinned commit
      65370b861b96efd30dfe0daae607bde26a78a5c8). In each "modify
      ciphertext" case the k field is the expected pseudorandom implicit-
      rejection output K' (equivalent to k_implicit in the original
      remediation). The Rust test
      nist_val_implicit_rejection_and_positive_decapsulate: (a) calls
      decapsulate(dk, c) for all 10 cases, (b) asserts Ok (not Err) for
      every case — confirming no error oracle on tampered input per FIPS
      203 §6.3, (c) asserts the returned key equals the NIST-provided k
      exactly — pinning K' to an authoritative reference value. The
      k_implicit != k_authentic paired assertion from the original
      remediation is subsumed: NIST computed both outputs from the same
      dk under the same reference implementation; if either differed from
      NIST the equality assertion would fail. cargo test -p
      meissnerseal-pqc exits 0.
    commit: "58b5146"

