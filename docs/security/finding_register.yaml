      enforcement of domain separation at the API boundary. Callers are
      responsible for prepending a protocol context string (documented in
      CONTRACT.md [P-04] and F-39), but the type system does not prevent passing
      raw payload bytes, making cross-protocol replay structurally possible if any
      caller omits the domain prefix. Related to F-39 (which tracks the caller
      obligation); this finding tracks the missing API-level enforcement.
    cwe: "CWE-325"
    severity: medium
