  - id: F-136
    kind: consistency
    component: specs
    source: "spec review — specs/protocol/vault_format_v1.md §1, §3, §10 (2026-07-05)"
    date: 2026-07-05
    description: >-
      vault_format_v1.md does not specify the required parser behaviour for
      duplicate or out-of-order header TLV tags. Three normative rules are
      absent:
      (1) Duplicate tag rejection: §1 requires rejection of "non-minimal
      encodings" but a duplicate tag (two entries with the same tag value
      and different or equal payloads) is not non-minimal in the TLV sense
      — both entries are independently well-formed. Without an explicit
      rule, two conforming parsers can diverge: one takes the first
      occurrence, one takes the last, producing different vault_id,
      kdf_profile, aead_profile, or schema_profile values from the same
      byte string. This is a canonical downgrade/ambiguity attack surface:
      a writer could include a strong aead_profile first and a weak one
      second; a parser that takes the last entry silently downgrades.
      (2) Duplicate critical TLV rejection not stated: §10 rejection rules
      list "Unknown critical TLV tags" but do not list "duplicate known
      critical TLV tag". The Rust parser (format.rs) uses reject_duplicate
      for inner KDF param TLVs but the review (F-121 gap 2, found
      2026-07-04) found that the outer header TLV layer does not call
      reject_duplicate for every known tag. The spec is the authority; it
      must state the rule before the implementation can be held to it.
      (3) Tag ordering: it is unspecified whether tags must appear in
      ascending numeric order, in the order listed in §3, or in any order.
      A KAT or cross-implementation interop test cannot determine whether
      a reordered header is valid without this rule. If canonical order is
      required for reproducible serialization (e.g. for KATs), the spec
      must say so. If order is free, the spec must say that too, so
      implementations do not accidentally rely on ordering.
    cwe: "CWE-20"
    severity: medium
    blocking: false
    status: open
    remediation: >-
      Add the following normative rules to vault_format_v1.md. Suggested
      placement: a new "§3.1 Header TLV Parsing Rules" subsection
      immediately after the Required MVP-0 Tags table, and add items (a)
      and (b) to the §10 rejection list.

      §3.1 Header TLV Parsing Rules (new subsection):

        (a) Duplicate tags: parsers MUST reject any header in which the
        same tag value appears more than once. The rejection applies to
        all known tags (0x0001–0x0007) and to any unknown tag that is
        critical (flags bit 0 set). An unknown non-critical tag appearing
        more than once MUST also be rejected (fail-closed default).

        (b) Tag ordering: header TLVs MAY appear in any order. Parsers
        MUST NOT assume ascending or sequential ordering. Writers SHOULD
        emit tags in ascending numeric order for reproducibility of test
        vectors and cross-implementation comparison.

        (c) First-wins: if a duplicate is not caught early (implementation
        defect), the parser MUST treat this as an error and not proceed
        with any derived value from either occurrence.

      Add to §10 rejection list:
        - Duplicate header TLV tag (known or unknown critical)

    verification: >-
      vault_format_v1.md §3.1 exists and contains rules (a), (b), (c).
      §10 rejection list includes "Duplicate header TLV tag". The Rust
      format.rs parser calls reject_duplicate for every known header tag
      (0x0001–0x0007) and the negative fixture for duplicate critical TLV
      (F-121 gap 2) passes. A vault with two 0x0001 (vault_id) TLV
      entries is rejected by the parser with a deterministic error.
    commit: ""

  - id: F-137
    kind: consistency
    component: specs
    source: "spec review — specs/protocol/vault_format_v1.md §6, §10 (2026-07-05)"
    date: 2026-07-05
    description: >-
      vault_format_v1.md does not specify whether the aead_profile field
      in a record frame (§6) must equal the aead_profile TLV in the vault
      header (§3). The two locations are independent fields and the spec
      gives no binding rule between them.
      §10 rejection rules state "nonce_len mismatching AEAD profile" —
      this pins the nonce length to the frame's own aead_profile value,
      but says nothing about consistency with the header's aead_profile.
      The Rust implementation (format.rs L1543-1547) checks:
        if aead_profile != AEAD_XCHACHA20_POLY1305_V1 { reject }
      This is a hardcoded constant check, not a cross-check against the
      parsed header value. For MVP-0 with a single supported AEAD profile
      the two are equivalent, but the rule is implemented via a magic
      constant rather than a structural invariant. If a second AEAD profile
      is added (AEAD_AES_256_GCM_STRICT_V1 = 0x0002 is already assigned
      in §3), a parser following the spec as written can accept a frame
      whose aead_profile differs from the header without violating any
      stated normative rule. A downgrade scenario: writer emits header
      aead_profile = 0x0001 (strong), a tampered frame carries aead_profile
      = 0x0002 (weaker nonce length), and the parser decrypts the frame
      under the wrong algorithm. The spec must close this gap before a
      second profile ships.
    cwe: "CWE-757"
    severity: medium
    blocking: false
    status: open
    remediation: >-
      Add Option A (MVP-0 strict) to vault_format_v1.md. Suggested
      placement: new rule in §6 after the frame layout, and a new item
      in the §10 rejection list.

      §6 addition:

        Frame aead_profile binding: For MVP-0, the aead_profile field in
        every record frame MUST equal header.aead_profile. Readers MUST
        reject any frame whose aead_profile does not match the header
        value. Writers MUST always write the header aead_profile into
        every frame. This rule eliminates per-frame AEAD negotiation and
        the associated downgrade surface. Future profiles that require
        per-frame agility MUST introduce a new schema_profile version and
        update this rule explicitly.

      §10 addition:
        - Record frame aead_profile not equal to header aead_profile

      Update format.rs parse_record_frame() to replace the hardcoded
      constant check with an explicit comparison against the caller-
      supplied header.aead_profile, so the code expresses the structural
      invariant rather than a magic constant. Add a negative test: a
      vault whose frame carries aead_profile = 0x0002 while header
      carries 0x0001 must be rejected.
    verification: >-
      vault_format_v1.md §6 contains the frame aead_profile binding rule.
      §10 rejection list includes "Record frame aead_profile not equal to
      header aead_profile". format.rs parse_record_frame() compares
      frame.aead_profile against the header value rather than a
      hardcoded constant. A negative test for mismatched frame/header
      aead_profile passes. cargo test -p meissnerseal-core exits 0.
    commit: ""

  - id: F-138
    kind: consistency
    component: specs
    source: "spec review — specs/protocol/vault_format_v1.md §6, §10 + format.rs parse_record_frame (2026-07-05)"
    date: 2026-07-05
    description: >-
      vault_format_v1.md §10 rejection rules omit five record-frame
      boundary conditions that the Rust parser already enforces (four
      cases) or fails to enforce (one case):
      (1) aad_len exceeding frame boundary: format.rs L1560-1564 checks
      aad_end > frame_len and rejects with "truncated record frame AAD".
      §10 lists "ciphertext_len exceeding frame boundary" but has no
      corresponding rule for aad_len.
      (2) aad_len not equal to 79 (RECORD_AAD_LEN): format.rs L1599 in
      validate_stored_record_aad() checks aad.len() != RECORD_AAD_LEN
      and rejects. §10 has no rule pinning aad_len to 79 for
      SCHEMA_MEISSNER_RECORDS_V2. Once §7 is corrected (F-57 note —
      spec still says 74), this becomes a strong fail-closed invariant:
      aad_len = 79 is the only valid value for V2 per-record frames.
      (3) frame_version != 1: format.rs L1534-1536 checks frame_version
      != FORMAT_VERSION and rejects. §10 lists "Unsupported format_version"
      at the file prefix level but not at the record frame level.
      (4) aead_profile unknown or unsupported in frame: format.rs L1545
      rejects any frame aead_profile != AEAD_XCHACHA20_POLY1305_V1.
      §10 covers nonce_len mismatching AEAD profile but not an unknown
      or unsupported frame aead_profile value explicitly.
      (5) ciphertext_len < AEAD tag length: format.rs L1577-1581 checks
      ciphertext_end > frame_len and ciphertext_end != frame_len, but
      does NOT check ciphertext_len >= POLY1305_TAG_LEN (16 bytes).
      A ciphertext of fewer than 16 bytes cannot contain a valid
      Poly1305 tag; passing it to the AEAD decrypt function is
      unnecessary and exposes the decrypt path to a degenerate input
      that should have been caught at the parse boundary. This is the
      only gap where both the spec and the code are missing the rule.
    cwe: "CWE-20"
    severity: low
    blocking: false
    status: open
    remediation: >-
      Spec fix — add the following to vault_format_v1.md §10 rejection
      list:
        - aad_len exceeding frame boundary (aad_end > frame_len)
        - aad_len != 79 for SCHEMA_MEISSNER_RECORDS_V2 per-record frames
          (must be listed after §7 is corrected to 79 bytes per F-57 note)
        - Record frame frame_version != 1
        - Record frame aead_profile unknown or not supported by this
          implementation (distinct from nonce_len mismatch)
        - ciphertext_len < AEAD tag length (16 bytes for Poly1305)

      Code fix for gap (5) only — add to parse_record_frame() after
      reading ciphertext_len (format.rs L1569):

        const POLY1305_TAG_LEN: usize = 16;
        if usize::try_from(ciphertext_len)
            .map_err(|_| format_error("ciphertext length overflow"))? < POLY1305_TAG_LEN
