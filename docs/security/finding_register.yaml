# ── meissnerseal-crypto KDF security review findings (2026-06-29) ─────────────

  - id: F-61
    kind: security_review
    component: "meissnerseal-core / meissnerseal-crypto"
    root_cause: KOK-A
    source: ""
    date: 2026-06-29
    description: >-
      Argon2 parameter validation enforces only zero and MAX bounds; the registered
      KDF_ARGON2ID_V1 minimums (m=65536, t=3, p=4) are never enforced at parse
      time. The security-critical entry point is meissnerseal-core/format.rs:
      parse_kdf_profile_params() (format.rs:1147) reads attacker-controlled vault
      header bytes, calls validate_argon2_params() (format.rs:1530), and returns
      HeaderKdfParams with the attacker-supplied values intact. These flow directly
      into derive_session_keys() via engine.rs:unlock_impl(). Full attack chain:
      vault file tamper → parse_header() [format.rs:1073] →
      parse_kdf_profile_params() → validate_argon2_params() accepts m=8 →
      derive_session_keys() derives MUK with m=8 → offline brute-force cost
      drops 8192x. The meissnerseal-crypto argon2.rs validate_argon2_params()
      has the identical gap; format.rs is the primary security-critical call site.
      See F-66 for the export/import exploitation surface. Root cause: KOK-A.
    cwe: "CWE-916"
    severity: high
    blocking: true
    blocks: "meissnerseal-core / meissnerseal-crypto security/mvp2-hardening gate"
    status: resolved
    remediation: >-
      Enforce the KDF_ARGON2ID_V1 minimum profile (m>=65536, t>=3, p>=4) inside
      parse_kdf_profile_params() in format.rs so no externally-read parameter set
      can produce a derivation weaker than the registered profile. Mirror the same
      minimum check in argon2.rs validate_argon2_params(). Test-only helpers that
      use below-profile parameters must be gated behind #[cfg(test)] or use a
      separate unchecked constructor.
    verification: >-
      Negative tests: parse_kdf_profile_params() rejects m_cost_kib < 65536,
      t_cost < 3, p_lanes < 4. Positive test: canonical KDF_ARGON2ID_V1 profile
      accepted. Integration test: vault file with tampered m_cost_kib=8 must
      return a parse error before any KDF derivation is invoked.
      cargo test -p meissnerseal-crypto -p meissnerseal-core: 165/165 pass (2026-06-29)
    commit: "3a066c9"

  - id: F-62
    kind: security_review
    component: meissnerseal-crypto
    source: ""
    date: 2026-06-29
    description: >-
      Argon2 and HKDF derivation functions copy secret outputs through plain stack
      arrays before wrapping them in zeroize-on-drop Key<N> types. Verified:
      argon2.rs:81 `let mut output = [u8; MasterUnlockKey::LEN]` → from_bytes(output);
      hkdf.rs:60 `let mut bytes = [u8; Prk::LEN]` → Prk::from_bytes(bytes);
      hkdf.rs:83 `let mut output = [u8; N]` → Key::from_bytes(output). After
      from_bytes moves the value, the compiler is not guaranteed to clear the
      original stack slot. Derived MUK, PRK, VKEK, and subkeys can remain in stack
      memory beyond their intended lifetime (process memory dump, swap, hibernation).
    cwe: "CWE-312"
    severity: medium
    blocking: true
    blocks: "meissnerseal-crypto security/mvp2-hardening gate"
    status: resolved
    remediation: >-
      argon2.rs:derive() output buffer wrapped in Zeroizing<[u8; 32]> before
      hash_password_into(); hkdf.rs:extract() PRK staging buffer and
      hkdf.rs:expand() output buffer both wrapped in Zeroizing. All three
      temporary secret buffers are now cleared on drop after Key::from_bytes().
    verification: >-
      KAT tests (vault_kdf_v1_vectors, test_muk_derivation, test_root_prk_derivation,
      test_subkey_derivation_all) confirm identical output after the Zeroizing
      wrapping. Full Miri proof deferred (MIRI-1 backlog). 238/238 workspace
      tests pass (2026-06-29).
    commit: "38c1da9"

