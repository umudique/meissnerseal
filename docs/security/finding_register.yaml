  - id: F-115
    kind: consistency
    component: test-vectors
    source: "test vector review — test-vectors/mlkem_cross_verify.py (2026-07-03)"
    date: 2026-07-03
    description: >-
      mlkem_cross_verify.py NIST_URL uses the /master/ ref
      (raw.githubusercontent.com/usnistgov/ACVP-Server/master/...) instead
      of the pinned commit recorded in mlkem_768_kat_v1.json source metadata
      (commit: 65370b861b96efd30dfe0daae607bde26a78a5c8). CI calls the
      verifier without --offline, so every CI run fetches from upstream
      master HEAD. If NIST upstream master advances or restructures the
      JSON format (e.g. testGroups schema change, tcId renumbering), fetch_nist()
      may return an empty result or unexpected data; len(nist) != len(TC_IDS)
      would catch an empty result, but a structural change that still
      returns the right count could produce false failures. The deeper
      issue is reproducibility: the verifier is not anchored to the commit
      from which the local vectors were sourced, so the comparison is not
      strictly reproducible across time. Separately, in a network-unavailable
      environment the script falls back to format-only mode and exits 0
      without signalling that the upstream comparison was skipped.
    cwe: null
    severity: low
    blocking: false
    status: resolved
    remediation: >-
      Root cause: mlkem_cross_verify.py conflates two distinct jobs —
      source fidelity (did we ingest vectors correctly from NIST?) and
      implementation correctness (does Rust reproduce the vectors?).
      Source fidelity is a one-time ingest step, not a CI gate.
      Implementation correctness is already covered by the Rust KAT tests
      that load the vectors via include_str!(). Running a live NIST fetch
      on every CI push asks the wrong question and introduces a network
      dependency. The correct architecture is: vendor the upstream
      internalProjection.json at the pinned commit into the repo (e.g.
      test-vectors/nist/mlkem_acvp_source.json); mlkem_cross_verify.py
      diffs the local vectors against the vendored copy without any network
      call; the --offline flag becomes unnecessary and should be removed;
      vector updates are a deliberate step (fetch new source, update vendor
      file, update pinned SHA, re-run verifier, commit). Additionally,
      replace /master/ in NIST_URL with the pinned commit SHA
      (65370b861b96efd30dfe0daae607bde26a78a5c8) for the refresh path, and
      assert at runtime that mlkem_768_kat_v1.json source.commit matches.
    verification: >-
      mlkem_cross_verify.py runs without network access and exits non-zero
      if local vectors differ from the vendored NIST source file.
      --offline flag is removed. NIST_URL (used only for vendor refresh)
      contains the pinned commit SHA. mlkem_768_kat_v1.json source.commit
      matches the vendored file's origin commit.
    commit: "58b5146"

