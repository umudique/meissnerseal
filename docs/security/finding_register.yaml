# MeissnerSeal — Finding Register
#
# Durable audit artifact: every security finding and verification-coverage gap,
# with finding -> remediation -> verification traceability.
# Maps to NIST SSDF RV.1/RV.2/RV.3 (see docs/security/standards_conformance.md §3).
#
# kind:      security_review | coverage_gap | consistency | design | security_architecture
# status:    open | resolved | accepted | deferred | rejected
# component: crate or subsystem the finding belongs to (e.g. meissnerseal-pqc)
# blocking:  true if it blocks a named gate
# blocks:    human-readable gate description when blocking: true
#            (e.g. "meissnerseal-pqc API Status: Stable")
# Live task edges that act on these findings live in arcanum-ops/tasks.yaml.

version: 1
updated: 2026-07-04

# ── Systemic root causes ──────────────────────────────────────────────────────
# Root causes are named patterns that appear across multiple findings.
# Each finding that traces to a root cause carries root_cause: <id>.

root_causes:
  - id: KOK-A
    name: "Externally-read security parameter used before minimum enforcement"
    date: 2026-06-29
    description: >-
      An attacker-controlled security parameter (Argon2 cost factors, algorithm
      ID, profile tag) is read from an external source (vault file, export bundle,
      transfer bundle) and consumed in a security-sensitive operation before any
      minimum or profile constraint is enforced. Authentication of the external
      source is either absent or occurs after the parameter is consumed. The gap
      is not in missing validation code per se, but in ordering: the pattern is
      read → use → (optionally) validate instead of read → validate-with-minimums
      → use. The attacker controls the parameter set; the victim's passphrase
      hardening budget is spent against an attacker-chosen cost, not the
      application-defined minimum.
    pattern: >-
      external_source → parse() → validate_bounds_only() → derive/sign/enc(params)
    instances:
      - finding: F-61
        location: "meissnerseal-core/src/vault/format.rs:1073 + 1530"
        surface: "vault file header Argon2 params → derive_session_keys()"
      - finding: F-66
        location: "meissnerseal-core/src/export.rs:154"
        surface: "export bundle Argon2 params → derive_export_key()"
    related_findings:
      - F-39
    remediation_pattern: >-
      Move minimum-profile enforcement into the parser (parse_kdf_profile_params),
      not into the consumer (derive_*). Any code path that ingests an external
      source must be unable to produce a below-minimum parameter struct; the
      struct type itself should be a proof of validity.

  - id: KOK-B
    name: "Authenticated state parsed at trust boundary not carried into session type"
    date: 2026-06-29
    description: >-
      Parameters authenticated at a trust boundary (vault_id, algorithm profile
      IDs, header nonce) are not captured into the session type at unlock time.
      Callers re-derive or re-read these values mid-session from mutable sources
      (disk, raw constants, scattered fields), creating TOCTOU windows and
      divergence between the identity established at unlock and the identity
      used during cryptographic operations. The gap is architectural: the type
      system does not carry proof of authentication forward, so callers cannot
      be prevented from drifting.
    pattern: >-
      parse_header() → use(header.field) at unlock →
      re-read(disk) / const VALUE at later operation (drift window)
    instances:
      - finding: F-75
        location: "meissnerseal-core/src/export.rs — session_vault_id()"
        surface: "vault_id re-read from disk at export time instead of carried from unlock"
      - finding: F-85
        location: "meissnerseal-core/src/vault/keys/hierarchy.rs — const AEAD_ID"
        surface: "hardcoded AEAD_ID constant diverges from header-bound aead_profile"
      - finding: F-98
        location: "meissnerseal-core/src/vault/format.rs — aead_profile / pqc_profile fields"
        surface: "algorithm profile IDs stored as raw u16 with no validated newtype"
      - finding: F-105
        location: "meissnerseal-core/src/vault/engine.rs — Vault<Unlocked>"
        surface: "vault_id absent from session type; re-derived or re-read on demand"
      - finding: F-108
        location: "meissnerseal-core/src/vault/engine.rs — Vault<Unlocked>"
        surface: "profile set absent from session type; algorithm choices not bound to session"
    related_findings:
      - F-73
    remediation_pattern: >-
      Introduce an AuthenticatedVaultContext struct capturing vault_id,
      header_nonce, and profile_set once at unlock from the parsed header.
      Embed in Vault<Unlocked>; all downstream operations read from context,
      never from disk or raw constants. Profile IDs use typed newtypes with
      fail-closed constructors validated at the parse boundary.

  - id: KOK-C
    name: "Security invariants expressed in prose not enforced by the type system"
    date: 2026-06-29
    description: >-
      Security-critical constraints (plaintext payload lifetime, item access
      scope, device key exposure surface, sender trust state) are documented
      in CONTRACT.md comments and /// doc comments but are not structurally
      enforced by the type system. A caller that ignores the documentation
      can violate the invariant without a compile error. The gap is not a
      missing check in one function but a pattern where the type boundary
      fails to express the security contract.
    pattern: >-
      /// # Security: caller must not retain plaintext beyond closure →
      fn returns T (T can be stored, cloned, leaked)
    instances:
      - finding: F-78
        location: "meissnerseal-core/src/vault/engine.rs — with_item()"
        surface: "with_item closure can return plaintext via captures; no type prevents it"
      - finding: F-83
        location: "meissnerseal-core/src/device/engine.rs — serialize_keypair_bytes()"
        surface: "pub function exposes raw keypair bytes; sealed-at-rest invariant unenforced"
      - finding: F-92
        location: "meissnerseal-core/src/protocol/envelope.rs — encode_signed_payload()"
        surface: "signed payload returned as Vec<u8>; plaintext lifetime unbounded by type"
      - finding: F-103
        location: "meissnerseal-core/src/vault/format.rs, export.rs, protocol/"
        surface: "trust boundary matrix (provenance, size, encoding) documented not typed"
      - finding: F-104
        location: "meissnerseal-core/src/protocol/envelope.rs — OpenEnvelopeParams"
        surface: "sender_signing_public_key: SigningPublicKey accepts any key regardless of trust state"
      - finding: F-106
        location: "meissnerseal-core/src/device/engine.rs — device key file"
        surface: "keypair file written without identity binding; substitution undetectable at load"
      - finding: F-107
        location: "meissnerseal-core/src/protocol/envelope.rs — open_envelope()"
        surface: "plaintext payload returned as Vec<u8>; callers can leak or retain it"
    related_findings:
      - F-83
      - F-104
    remediation_pattern: >-
      Replace return types and parameter types with typed wrappers that make
      the security invariant a compile-time guarantee: SecretPayload (no Clone,
      ZeroizeOnDrop), with_item returning Result<()> (closure cannot return T),
      TrustedSender (constructable only from verified DeviceIdentity),
      SealedDeviceKeyFile (sealed write/open API, no raw byte exposure).

  - id: RC-TV-B
    name: "Incomplete arcanum→meissnerseal rename in test vector scripts and wire format"
    date: 2026-07-04
    description: >-
      When the project was renamed from arcanum/qvault to meissnerseal, domain
      strings, magic bytes, and namespace constants in test vector scripts were
      not updated atomically. The production implementation was updated (all
      meissnerseal-* prefixes, MEISSNER wire magic) but the test vector layer
      retained pre-rename artifacts. This creates a structural divergence between
      the canonical values enforced by the production code and the values
      hardcoded in the generators and wire-format constants. The rename affected
      at least two distinct layers: (1) domain prefix strings embedded in AAD
      construction (arcanum-aad-v1 vs meissnerseal-aad-v1), and (2) wire format
      magic bytes (ARCEXP vs MSEXP). Because generators write JSON from these
      stale values, the CI drift guard correctly rejects their output — the
      rename drift is caught, but it makes regeneration impossible until the
      generators are updated.
    pattern: >-
      rename(arcanum → meissnerseal) applied to production code +
      not applied to test vector generators + wire constants
    instances:
      - finding: F-110
        location: "test-vectors/cross_verify.py L537"
        surface: "generate_aead_vectors() hardcodes b\"arcanum-aad-v1\" 14-byte prefix"
      - finding: F-117
        location: "test-vectors/generate_export_import.py L28 + crates/meissnerseal-core/src/export.rs L27"
        surface: "ARCEXP_MAGIC = b\"ARCEXP\\x01\\x00\" — pre-rename wire magic in both Python and Rust"
    remediation_pattern: >-
      Update all pre-rename strings atomically: replace arcanum-aad-v1 with
      meissnerseal-aad-v1 in generate_aead_vectors(); rename ARCEXP_MAGIC to
      MSEXP_MAGIC and b"ARCEXP\x01\x00" to b"MSEXP\x01\x00" in both
      generate_export_import.py and export.rs in the same commit. Add a
      forbidden-prefix scan (validate_vectors.py, F-117) to prevent
      re-introduction.

