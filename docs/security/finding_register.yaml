      immediately on drop, the secret is briefly live in memory during every
      list call, widening the exposure window unnecessarily.
    cwe: "CWE-312"
    severity: medium
    blocking: false
    status: open
    remediation: >-
      Split item metadata and secret payload into separately authenticated
      encrypted regions, or add a metadata-only record path that authenticates
      and decrypts label/tags without unwrapping the REK or decrypting the
      secret field.
    verification: >-
      Add tests or instrumentation proving list does not construct SecretBytes,
      unwrap REKs, or decrypt secret payloads when only summaries are requested.
    commit: ""

  - id: F-80
