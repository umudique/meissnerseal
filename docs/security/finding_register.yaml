# ── meissnerseal-core transfer / envelope / replay security review (2026-06-30) ─

  - id: F-89
    kind: security_review
    component: meissnerseal-core
    source: "security review — crates/meissnerseal-core/src/transfer/envelope.rs (2026-06-30)"
    date: 2026-06-30
    description: >-
      open_envelope inserts the envelope_id into the replay store immediately
      after validate_envelope (which checks transcript hash, expiry, and
      profile) and before ML-KEM decapsulation, AEAD authentication, signed
      payload decoding, or sender signature verification. The transcript hash
      does not cover encrypted_payload, so an attacker who can observe a real
      envelope can copy all its fields, substitute garbage encrypted_payload,
      and deliver the modified copy first. The modified envelope passes
      validate_envelope, the ID is committed to the replay store, and the
      authentic envelope is later rejected as replayed.
    cwe: CWE-696
    severity: medium
    blocking: true
    status: resolved
    remediation: >-
      Split replay handling into a check-only phase before expensive work and a
      commit phase only after AEAD authentication and sender signature
      verification both succeed. Evict expired entries before the check, but do
      not persist a new ID until the envelope has been fully accepted.
    verification: >-
      Add a test that submits a transcriptvalid envelope with garbage
      encrypted_payload first, then submits the authentic envelope with the
      same envelope_id and verifies it is still accepted without replay error.
    commit: "ea67426"

  - id: F-90
    kind: consistency
    component: meissnerseal-core
    source: "security review — crates/meissnerseal-core/src/transfer/envelope.rs (2026-06-30)"
    date: 2026-06-30
    description: >-
      Anonymous-recipient support is architecturally incomplete.
      TranscriptParams has an anonymous_recipient_public_key field and the
      contract says anonymous mode must bind it, but both create_envelope and
      validate_envelope always pass None for this field. When
      recipient_device_id is also None, compute_transcript_hash includes no
      recipient material at all, allowing any party to decrypt without
      transcript-level binding to a recipient. There is also no mode
      discriminator byte in the transcript to distinguish identified from
      anonymous mode.
    cwe: "CWE-325"
    severity: medium
    blocking: true
    status: resolved
    remediation: >-
      Add an explicit recipient mode to CreateEnvelopeParams and the
      transcript. For anonymous mode, require and transcript-bind the anonymous
      recipient public key or a canonical fingerprint thereof. Reject envelopes
      where recipient_device_id is None and no anonymous recipient binding is
      present. Add a mode discriminator byte to the transcript so identified
      and anonymous inputs cannot be confused.
    verification: >-
      Add transcript KATs for identified and anonymous recipients confirming
      they produce distinct hashes, and negative tests proving anonymous
      envelopes fail validation when the bound anonymous key is absent or
      modified.
    commit: "ea67426"

