# ── meissnerseal-core device identity & pairing security review (2026-06-30) ─

  - id: F-83
    kind: security_review
    root_cause: KOK-C
    component: meissnerseal-core
    source: "security review — crates/meissnerseal-core/src/keys/device.rs (2026-06-30)"
    date: 2026-06-30
    description: >-
      serialize_keypair_bytes is a public function that writes X25519 private
      key bytes, ML-KEM-768 private key bytes, and signing private key bytes
      into a raw Zeroizing<Vec<u8>> without encryption or authentication. The
      Zeroizing wrapper clears memory on drop but does not prevent the caller
      from persisting or transmitting the plaintext bytes before the value is
      dropped. Because the function is public, any crate can obtain unencrypted
      device private key material via a single call.
    cwe: "CWE-312"
    severity: medium
    blocking: true
    status: resolved
    remediation: >-
      Change serialize_keypair_bytes to pub(crate), or replace it with a
      storage API that encrypts and authenticates the serialized bytes under a
      typed device-key encryption key before returning anything persistable.
      All call sites that write .ms-kp files must go through the protected path.
    verification: >-
      Add API tests proving that external callers cannot obtain raw plaintext
      device private key bytes. Add storage round-trip tests proving persisted
      keypair bytes are AEAD-protected and reject tampering.
    commit: "59df4c3"

  - id: F-84
    kind: security_review
    component: meissnerseal-core
    source: "security review — crates/meissnerseal-core/src/keys/device.rs (2026-06-30)"
    date: 2026-06-30
    description: >-
      deserialize_keypair_bytes accepts the signing algorithm tag and a u32
      signing key length field without validating that the byte count matches
      the expected length for that algorithm. For Ed25519V1 the private key
      must be 32 bytes, but any u32 length is accepted and the bytes are
      passed directly to SigningPrivateKey::new. Additionally the deserialized
      X25519 classical_public_key is never verified against the classical
      private key; any public key can be paired with any private key in the
      stored file. ML-KEM and X25519 private key field sizes are enforced
      implicitly by take_array const-generic bounds, so the gap is limited to
      signing key length and public/private coherence.
    cwe: CWE-20
    severity: medium
    blocking: false
    status: resolved
    remediation: >-
      During deserialization, reject signing key lengths that do not match the
      declared algorithm (Ed25519V1 must be exactly 32 bytes; Unimplemented
      algorithms must be rejected outright). Recompute the X25519 public key
      from the deserialized private key and compare it to the stored public key
      before accepting the keypair as valid.
    verification: >-
      Add malformed keypair tests for wrong Ed25519V1 signing key length,
      unimplemented signing algorithm, X25519 public/private mismatch, and
      trailing garbage bytes after the final field.
    commit: "ea67426"

  - id: F-85
    kind: security_review
    root_cause: KOK-B
    component: meissnerseal-core
    source: "security review — crates/meissnerseal-core/src/keys/hierarchy.rs (2026-06-30)"
    date: 2026-06-30
    description: >-
      Vault session key derivation hardcodes AEAD_ID = 1 when calling
      derive_subkeys for AEAD-scoped item-wrap and metadata subkeys.
      Neither derive_session_keys nor create_session_keys receives the vault
      header aead_profile as a parameter; the module-level constant is used
      unconditionally. derive_subkeys accepts aead_id as a parameter, so the
      registry design supports crypto-agile derivation, but neither call site
      plumbs the actual header AEAD profile ID through. If a new AEAD profile
      is introduced, both paths will silently derive subkeys under the wrong
      profile binding. (see F-108)
    cwe: "CWE-325"
    severity: medium
    blocking: true
    status: resolved
    remediation: >-
      Add an aead_profile parameter to derive_session_keys and
      create_session_keys and pass it to derive_subkeys. Parse and validate the
      header aead_profile before calling either function, and reject unsupported
      AEAD profile IDs before any key derivation begins.
    verification: >-
      Add vectors showing that different header AEAD profile IDs produce
      distinct item-wrap and metadata subkeys. Add tests proving that unlock
      fails closed for an unsupported AEAD profile ID.
    commit: "bf177a4"

  - id: F-86
    kind: design
    component: meissnerseal-core
    source: "security review — crates/meissnerseal-core/src/keys/pairing.rs (2026-06-30)"
    date: 2026-06-30
    description: >-
      The PairingTranscript contract specifies that Phase 2 must sign the
      pairing transcript using sign_enrollment_message() and the DEVICE-1
      enrollment domain prefix (meissnerseal.device.enrollment.v1\0). Reusing
      the enrollment domain for a semantically distinct pairing transcript means
      that enrollment signatures and pairing signatures are not
      non-interchangeable at the type or domain level. If the serialized
      transcript bytes of an enrollment payload and a pairing payload ever
      overlap due to format evolution, cross-protocol signature replay becomes
      possible.
    cwe: "CWE-325"
    severity: medium
    blocking: true
    status: resolved
    remediation: >-
      Add a dedicated pairing signing domain constant such as
      meissnerseal.device.pairing.v1\0 and a sign_pairing_message helper
      mirroring sign_enrollment_message. Update PairingTranscript and DEVICE-2
      Phase 2 to use the pairing domain. Keep enrollment and pairing APIs
      non-interchangeable at the call-site level.
    verification: >-
      Add tests proving that the same transcript bytes signed under enrollment
      and pairing domains produce distinct signatures, and that pairing
      verification rejects enrollment-domain signatures.
    commit: "ea67426"

  - id: F-87
    kind: security_review
    component: meissnerseal-core
    source: "security review — crates/meissnerseal-core/src/keys/pairing.rs (2026-06-30)"
    date: 2026-06-30
    description: >-
      validate_trust_transition allows cross-transitions between the two
      terminal states: Expired -> Revoked (line 305) and Revoked -> Expired
      (line 311) both return Ok(()). The DeviceTrustState contract in device.rs
      states "Revoked and Expired are terminal states for DEVICE-1 policy" but
