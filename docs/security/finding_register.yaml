    severity: medium
    blocking: true
    blocks: "fix/mvp2-test-vectors"
    status: resolved
    remediation: >-
      Perform the ARCEXP→MSEXP rename (F-117 / RC-TV-B) atomically across
      export.rs, generate_export_import.py, and export_import_v1.json in
      a single commit: update ARCEXP_MAGIC to MSEXP_MAGIC with the new
      wire bytes, regenerate export_import_v1.json, and update the profile
      field to the canonical post-rename name. Do not rename the source
      files without simultaneously regenerating the JSON — a partial rename
      leaves the KATs in a broken state. After the rename the
      forbidden-prefix scan (F-117) must find no ARCEXP strings in any
      *.json under test-vectors/.
    verification: >-
      export_import_v1.json profile field contains no "ARCEXP" substring.
      aad_hex and bundle_hex in all cases decode to the MSEXP magic bytes.
