      returns Err("unsupported pqc profile"). However vault_format_v1.md
      §10 does not list "unsupported pqc_profile value" as a rejection
      rule. Because pqc_profile TLV is non-critical (flags=0), the
      "unknown critical TLV" rejection rule in §10 does not apply. The
      spec is therefore silent on what a reader must do when pqc_profile
      is present and non-zero — a conforming reader following only the
