# ── meissnerseal-core vault module security review (2026-06-30) ───────────────

  - id: F-96
    kind: security_review
    component: meissnerseal-core
    source: "security review — crates/meissnerseal-core/src/vault/engine.rs (2026-06-30)"
    date: 2026-06-30
    description: >-
      Vault create and mutation paths create temporary and final vault files
      using std::fs::OpenOptions without setting explicit file permissions.
      On Unix, all three creation sites (target_claim in persist_vault,
      tmp_file in persist_vault_inner, and tmp_file in
      persist_vault_mutation_v2) rely entirely on the process umask. With a
      permissive umask such as 0o022, newly created vault files become
      world-readable (0o644), exposing the encrypted vault bytes including
      the magic, header metadata, and ciphertext to any local user.
    cwe: "CWE-276"
    severity: medium
    blocking: true
    status: resolved
    remediation: >-
      Create vault and temporary files with explicit owner-only permissions
      on Unix (0o600 via OpenOptionsExt::mode). Preserve or intentionally
      tighten existing vault file permissions during atomic replacement.
      Add platform-specific handling or documented secure defaults for
      non-Unix targets.
    verification: >-
      Add tests that create and mutate a vault under a permissive umask
      (set via libc::umask) and assert the resulting vault file and
      temporary file have mode 0o600. Add a regression test proving
      mutation does not widen an existing restrictive vault file mode.
    commit: "ea67426"
    note: >-
      2026-07-05 — F-96 implementation fix sets 0o600 in persist_vault
      and persist_vault_mutation_v2. However, e2e.rs contains no
      assertion that the CLI-produced .msv (init) or .msexp (export)
      files actually carry mode 0o600 on disk. An E2E test that reads
      metadata().permissions().mode() after init and export and asserts
      0o600 would pin the permission contract at the integration layer.
      Coverage gap tracked as F-152.

  - id: F-97
    kind: security_review
    component: meissnerseal-core
    source: "security review — crates/meissnerseal-core/src/vault/format.rs (2026-06-30)"
    date: 2026-06-30
    description: >-
      parse_header processes the header TLV section in a single loop but
      does not call reject_duplicate for any top-level tag. Duplicate
      TAG_VAULT_ID, TAG_CREATED_AT, TAG_KDF_PROFILE, TAG_AEAD_PROFILE,
      TAG_PQC_PROFILE, TAG_SCHEMA_PROFILE, or TAG_HEADER_NONCE TLVs are
      silently accepted, with the last occurrence overwriting all previous
      values. The reject_duplicate helper is defined and used correctly
      inside parse_kdf_profile_params for Argon2 sub-parameters, but not
      applied to the outer TLV layer. A non-canonical header with duplicate
      critical fields allows different parsers to select different effective
      values for vault_id, header_nonce, or algorithm profiles.
    cwe: "CWE-20"
    severity: medium
    blocking: true
    status: resolved
    remediation: >-
      Track whether each known header TLV has already appeared and call
      reject_duplicate for every registered top-level tag before assigning
      the new value. Non-critical unknown TLVs may be skipped, but
      duplicate known critical tags must produce an Err.
    verification: >-
      Add malformed header tests with duplicated TAG_VAULT_ID,
      TAG_KDF_PROFILE, TAG_AEAD_PROFILE, TAG_PQC_PROFILE,
      TAG_SCHEMA_PROFILE, and TAG_HEADER_NONCE TLVs. CI should fail if
      any duplicate known header field parses successfully.
    commit: "ea67426"

  - id: F-98
    kind: security_review
    root_cause: KOK-B
    component: meissnerseal-core
    source: "security review — crates/meissnerseal-core/src/vault/format.rs (2026-06-30)"
    date: 2026-06-30
    description: >-
      parse_header validates that schema_profile equals
      SCHEMA_MEISSNER_RECORDS_V2 and delegates KDF profile validation to
      parse_kdf_profile_params, but does not validate the aead_profile or
      pqc_profile values. An unsupported aead_profile (anything other than
      AEAD_XCHACHA20_POLY1305_V1) or pqc_profile (anything other than
      PQC_NONE) passes parse_header and is stored in VaultHeader without
      rejection. The rest of the implementation continues under the fixed
      XChaCha20-Poly1305 and inactive-PQC assumptions regardless of the
      parsed profile values, creating a gap between the accepted header
      and the implemented cryptographic behavior. (see F-108)
    cwe: "CWE-327"
    severity: medium
    blocking: true
    status: resolved
    remediation: >-
      After the TLV loop, reject aead_profile values other than
      AEAD_XCHACHA20_POLY1305_V1 and pqc_profile values other than
      PQC_NONE until additional profiles are fully implemented. Ensure
      the AEAD profile rejection happens before any session key derivation
      or record frame decryption, consistent with the existing schema
      profile gate.
    verification: >-
      Add tests that construct or patch headers with unsupported AEAD
      and PQC profile values and assert parse_header or unlock fails
      closed before record frame decryption or session key derivation.
    commit: "936a437"

  - id: F-99
    kind: security_review
    component: meissnerseal-core
    source: "security review — crates/meissnerseal-core/src/vault/format.rs (2026-06-30)"
    date: 2026-06-30
    description: >-
      parse_record_frame reads frame_version and the frame-local AEAD
      profile field but validates neither. frame_version is stored in
      RecordFrame without checking it equals FORMAT_VERSION. The local
      AEAD profile is assigned to a variable prefixed with underscore and
      is entirely unused. Additionally, the stored AAD bytes are bounds-
      checked for truncation but then skipped: the parser advances past
      them without comparing the stored content to the canonical AAD that
      callers will reconstruct from the frame metadata. Mutable frame
      metadata can therefore drift from the authenticated interpretation
      used for decryption without triggering a parser rejection. (see F-108)
    cwe: "CWE-345"
    severity: medium
    blocking: true
    status: resolved
    remediation: >-
      Validate frame_version == FORMAT_VERSION and the frame-local AEAD
      profile == AEAD_XCHACHA20_POLY1305_V1 inside parse_record_frame.
      Validate aad_len == AAD_LEN and compare the stored AAD bytes to
      the canonical AAD expected for the frame. Alternatively remove
      the stored AAD from the frame format if it is not intended to be
      authoritative.
    verification: >-
      Add tests that patch frame_version, the frame AEAD profile,
      aad_len, and stored AAD bytes while leaving ciphertext unchanged.
      Each case should fail before or during unlock or list instead of
      silently accepting drift.
    commit: "ea67426"

  - id: F-100
    kind: security_review
    component: meissnerseal-core
    source: "security review — crates/meissnerseal-core/src/vault/format.rs (2026-06-30)"
    date: 2026-06-30
    description: >-
      open_sealed_record_table_v2 checks that each entry frame_offset is
