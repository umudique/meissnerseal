    status: resolved
    remediation: >-
      Added sign_with_domain(key, domain, payload) and verify_with_domain(key, domain, payload, sig)
      to mldsa.rs. These functions accept domain and payload as separate parameters,
      making domain separation structurally mandatory. Production callers updated:
      sign_enrollment_message (device.rs) and create/open transfer envelope (envelope.rs)
      now use sign_with_domain/verify_with_domain. Raw sign/verify retained as public
      for tests and advanced callers with documented contract obligation.
    verification: >-
      sign_with_domain_matches_manual_domain_prepend verifies API equivalence with
      manual concatenation. sign_with_domain_different_domains_produce_different_signatures
      confirms cross-domain replay protection. Existing domain_is_distinct test retained.
