# ── meissnerseal-crypto external security review findings (2026-06-29) ────────

  - id: F-56
    kind: security_review
    component: meissnerseal-crypto
    source: ""
    date: 2026-06-29
    description: >-
      AEAD encrypt/decrypt accept raw aad: &[u8] and do not enforce the canonical
      MeissnerSeal AAD shape at the crypto boundary. A caller can accidentally
      encrypt or decrypt with empty, truncated, reordered, or cross-protocol AAD,
      weakening record/header binding even though authentication itself is
      performed correctly by XChaCha20-Poly1305. Verified: aead.rs:93 encrypt and
      aead.rs:157 decrypt both take aad: &[u8] with no length or structure check.
    cwe: "CWE-325"
    severity: medium
    blocking: true
    blocks: "meissnerseal-crypto security/mvp2-hardening gate"
    status: resolved
    remediation: >-
      Compile-time enforcement already exists: build_aad() / item_record_aad()
      return [u8; 79], so the type system prevents wrong-length record AAD from
      reaching encrypt/decrypt without explicit unsafe coercion. Added
      RECORD_AAD_LEN=79 constant to aead.rs documenting the invariant. The AEAD
      primitive intentionally accepts &[u8] to serve multiple domains (table=18,
      export=26, transfer=32, record=79); a runtime check at the primitive level
      would break those callers. Docstring updated 74→79 bytes (F-57 co-fix).
    verification: >-
      RECORD_AAD_LEN constant added to aead.rs; test vectors updated to 79-byte
      AAD; types.rs TODO updated to reference 79 bytes. 238/238 workspace tests
      pass (2026-06-29).
