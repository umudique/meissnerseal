      UG hash-everything combiner. Both cases use identical X25519 keypairs
      and identical pqc_shared_secret; only pqc_ciphertext and
      transcript_hash differ between the two cases, and they change
      simultaneously — it is impossible to isolate which input variation
      drives the transfer_key change. No negative or mismatch cases exist.
      The following gaps are present:
      (1) Low input diversity: sender/recipient X25519 keypairs and
      pqc_shared_secret are identical across both cases. A combiner
      implementation that hard-codes any of these values would still
      produce the correct output for all existing cases.
      (2) transcript_hash change not isolated: case-01 changes both
      pqc_ciphertext and transcript_hash relative to case-00, so the
      test does not prove that transcript_hash is a distinct input to
      the HKDF salt slot.
      (3) No sender/recipient key swap case: swapping sender and
      recipient keys must produce a distinct transfer_key, confirming
      directional binding. Absent.
      (4) No pqc_ciphertext mutation case: changing one byte of
      pqc_ciphertext (with all other inputs fixed) must change
      transfer_key, confirming that the ciphertext transcript is bound.
      Absent.
