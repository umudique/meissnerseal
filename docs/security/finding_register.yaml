      length (L451) uses a 5-byte signature and asserts MalformedSignature.
      No test supplies a well-formed 64-byte signature with flipped bits
      and asserts VerificationFailed. The wrong-message test (L428) covers
      the message side but not the signature side.

      (3) AlgorithmMismatch reverse direction — verify_rejects_algorithm_
      mismatch (L470) uses Ed25519V1 public key + Ed25519MlDsa87HybridV1
      signature. The reverse (Ed25519MlDsa87HybridV1 public key +
      Ed25519V1 signature) is not tested; the verify() early-return guard
      is symmetric but the coverage is not.
