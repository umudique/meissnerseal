      (7) No pqc_ciphertext wrong-length case: the verifier checks
      len(pqc_ciphertext) == 1088 (L73) but there is no JSON negative
      case exercising rejection of a shorter or longer value.
      (8) Top-level schema and profile not asserted by verifier: main()
      never reads vectors["schema"] or vectors["profile"], so drift in
      these fields is invisible to CI.
