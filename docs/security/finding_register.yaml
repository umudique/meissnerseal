        fn verify_with_domain_rejects_wrong_domain() {
            let (pub_key, priv_key) = ed25519_keypair();
            let payload = b"payload";
            let sig = sign_with_domain(&priv_key, b"domain.a\x00", payload)
                .expect("sign");
            assert!(matches!(
                verify_with_domain(&pub_key, b"domain.b\x00", payload, &sig),
                Err(SigningError::VerificationFailed)
            ));
        }

        #[test]
        fn verify_with_domain_rejects_wrong_payload() {
            let (pub_key, priv_key) = ed25519_keypair();
            let domain = b"meissnerseal.test.v1\x00";
            let sig = sign_with_domain(&priv_key, domain, b"payload")
                .expect("sign");
            assert!(matches!(
                verify_with_domain(&pub_key, domain, b"altered", &sig),
                Err(SigningError::VerificationFailed)
            ));
        }

        #[test]
        fn verify_rejects_tampered_signature() {
            let private_key = ed25519_private_key();
            let public_key = ed25519_public_key();
            let mut sig_bytes = sign(&private_key, MESSAGE)
                .expect("sign").as_bytes().to_vec();
            sig_bytes[0] ^= 0xff;
