  - id: F-122
    kind: security_architecture
    component: meissnerseal-core
    source: "test vector review — cross-analysis of format.rs and cross_verify.py (2026-07-04)"
    date: 2026-07-04
    description: >-
      In parse_vault_header() (format.rs), pqc_profile is initialized as
      Some(0) (L1172) rather than None. This means a vault file with the
      TAG_PQC_PROFILE TLV absent is accepted silently with pqc_profile=0
      (PQC_NONE). The TAG_PQC_PROFILE TLV is also written with flags=0
      (non-critical, L451) in both the Rust serializer and the Python
      generator. The combination creates a double non-mandatory path:
      (a) non-critical flag — a parser that does not know tag 0x0005
      skips it silently; (b) Some(0) default — even a parser that does
      know the tag accepts a vault where the TLV is absent.
      Consequence: the .ok_or_else(|| format_error("missing pqc_profile"))
      at L1271 is dead code — pqc_profile can never be None at that point,
      so the "missing pqc_profile" error is unreachable.
      Mitigation: the 79-byte canonical AAD already binds pqc_profile; a
      stripped or modified pqc_profile TLV causes a miscomputed AAD and
      therefore an AEAD authentication failure — the attack fails closed
      at the decryption step. A comment at L1168-1171 explicitly documents
      that this defaulting behaviour is intentional for the current MVP
      phase: "When PQC becomes active this MUST change to None + reject so
      a stripped tag cannot force a silent downgrade." However, three gaps
      remain: (1) the dead error path at L1271 is misleading; (2) no test
      vector exercises the "absent pqc_profile TLV → parsed as PQC_NONE"
      intentional behaviour; (3) the TODO has no gating mechanism to enforce
      activation when PQC becomes live.
    cwe: "CWE-636"
    severity: low
    blocking: false
    status: resolved
    remediation: >-
      Short term: remove the dead .ok_or_else("missing pqc_profile") at
      L1271 (or change it to an assert) to make the defaulting intent
      explicit rather than disguised as a required-field check. Add an
      acceptance test vector to vault_format_struct_v1.json with the
