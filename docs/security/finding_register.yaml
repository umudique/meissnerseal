    source: "test vector review — test-vectors/cross_verify.py (2026-07-03)"
    date: 2026-07-03
    description: >-
      cross_verify.py run() is not fail-closed on ImportError or
      NotImplementedError. When a required Python dependency (e.g. PyNaCl,
      argon2-cffi) is absent, the affected generators (AEAD, wrap,
      format_struct, format_negative) are silently skipped and the process
