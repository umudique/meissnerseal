    cwe: "CWE-284"
    severity: medium
    blocking: true
    status: resolved
    remediation: >-
      Remove the Revoked -> Expired and Expired -> Revoked arms from
      validate_trust_transition. Allow only idempotent self-transitions
      (Revoked -> Revoked, Expired -> Expired) for terminal states, and return
      Err(InvalidTrustTransition) for any cross-terminal transition unless the
      persisted policy model explicitly requires otherwise.
    verification: >-
      Add a complete transition-matrix test covering every DeviceTrustState
      source/target pair and asserting that Revoked and Expired cannot
      transition to any state other than themselves.
    commit: "ea67426"

