  - id: F-204
    kind: security_review
    component: meissnerseal-core
    source: "security review — crates/meissnerseal-core/src/transfer/replay.rs (2026-07-05)"
    date: 2026-07-05
    description: >-
      Two related invariant gaps in SeenEnvelopeIds.
      (1) check_and_insert() does not cap the number of live entries at
      MAX_REPLAY_ENTRIES. If evict_expired() removes nothing (all entries are
      non-expiring or not yet expired), the store grows without bound. When
      entries.len() exceeds 65_536 the serialized blob produced by to_bytes()
      is valid UTF-8 but will be rejected by from_bytes() on the next load,
      silently breaking persistence.
      (2) to_bytes() uses u32::try_from(self.entries.len()).unwrap_or(u32::MAX)
      to encode the count. If entries.len() somehow exceeds u32::MAX on a
      64-bit host the count field is silently clamped to u32::MAX rather than
      returning an error, producing a structurally corrupt blob. There is no
      test for either behavior.
    cwe: "CWE-190"
    severity: medium
    blocking: false
    status: open
    remediation: >-
      (1) Enforce the MAX_REPLAY_ENTRIES cap in check_and_insert(): after
      evict_expired(), if self.entries.len() >= MAX_REPLAY_ENTRIES as usize,
      return Err(TransferError::ReplayStoreFull) or evict the oldest entry.
      (2) Change to_bytes() to return Result<Vec<u8>, TransferError> and
      propagate a conversion error instead of clamping. Alternatively,
      enforce the cap in (1) and add a debug_assert in to_bytes(). Add tests
      for both behaviors.
    verification: >-
      Inserting MAX_REPLAY_ENTRIES + 1 entries without expiry is rejected or
      causes the oldest to be evicted. to_bytes() on a valid store never
      produces a blob from_bytes() would reject. cargo test passes.
    commit: ""

  - id: F-205
    kind: coverage_gap
    component: meissnerseal-core
    source: "security review — crates/meissnerseal-core/src/transfer/replay.rs (2026-07-05)"
    date: 2026-07-05
    description: >-
      from_bytes() parses the serialized entry list into a Vec without
      checking for duplicate EnvelopeId values. A crafted or corrupted byte
      blob containing two entries with the same ID is accepted silently. The
      first subsequent call to check_and_insert() with that ID will return
      ReplayedEnvelopeId regardless of whether the envelope was legitimately
      seen, because the duplicate ID in the store matches before the new ID
      is compared. If the persisted replay store is the authoritative
      record of accepted envelopes, the parser should treat duplicate IDs as
      malformed input rather than deferring the check to runtime.
    cwe: "CWE-20"
    severity: medium
    blocking: false
    status: resolved
    remediation: >-
      In from_bytes(), after parsing each entry, check whether its ID is
      already in the partially built entries Vec and return
      Err(MalformedReplayStore) on a duplicate. Add a test that serializes a
      blob with count == 2 and identical 16-byte IDs and asserts the result
      is Err(MalformedReplayStore).
    verification: >-
      A blob with duplicate IDs is rejected by from_bytes(). cargo test -p
      meissnerseal-core passes.
    commit: "d81a18f"

