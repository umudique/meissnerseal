      or explicitly state that eviction is lazy and only occurs on
      check_and_insert(). Add a test that calls from_bytes() with a blob
      containing one expired and one live entry, then asserts the expected
      entry count (1 for eager, 2 for lazy) without calling check_and_insert().
    verification: >-
      Eviction policy is documented in the contract comment and pinned by a
      test. cargo test -p meissnerseal-core passes.
    commit: ""

