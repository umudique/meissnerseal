      and AEAD decryption before the sender signature can be decoded and
      verified. Unauthenticated parties who know the recipient public keys can
      force this KEM and AEAD work on the receiver by sending syntactically
      valid envelopes with crafted or random ciphertext. The code comment in
      create_envelope acknowledges this signcryption tradeoff.
    cwe: CWE-325
    severity: low
    blocking: false
    status: open
    remediation: >-
      Consider moving an algorithm-tagged sender signature over the transcript
      hash, nonce, and ciphertext into cleartext envelope metadata so sender
      authentication can be verified before KEM decapsulation. If the current
      signcryption structure is retained for protocol reasons, document the DoS
      tradeoff and implement rate limiting or sender allow-listing before
      performing KEM work.
    verification: >-
      Add benchmarks or tests demonstrating that unauthenticated envelopes are
      rejected before decapsulation when cleartext sender signatures are
      present, or add policy tests for rate limiting applied before
      open_envelope performs KEM work.
    commit: ""

  - id: F-94
    kind: security_review
    component: meissnerseal-core
    source: "security review — crates/meissnerseal-core/src/transfer/replay.rs (2026-06-30)"
    date: 2026-06-30
    description: >-
      SeenEnvelopeIds::from_bytes reads the count field as u32 and immediately
      calls Vec::with_capacity(count) before verifying the remaining input
      contains count complete replay entries. Each entry is 24 bytes (16-byte
      EnvelopeId + 8-byte expires_at). A malformed replay-store file with
      count = u32::MAX requests allocation for approximately 96 GiB before any
      bounds check, causing an OOM abort or panic on most platforms.
    cwe: "CWE-400"
    severity: low
    blocking: false
    status: resolved
    remediation: >-
      Before allocating, verify that bytes.len() >= 4 + count * 24 (with
      overflow-safe arithmetic) and that count does not exceed a defined
      maximum replay-store entry limit. Return MalformedReplayStore immediately
      if either condition fails.
    verification: >-
      Add tests for count = u32::MAX, count values whose declared size exceeds
      the actual input, exact-boundary valid stores, and trailing garbage.
      Confirm no allocation occurs before the bounds check passes.
    commit: "ea67426"

