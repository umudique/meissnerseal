    cwe: "CWE-345"
    severity: medium
    blocking: true
    status: resolved
    remediation: >-
      Validate frame_version == FORMAT_VERSION and the frame-local AEAD
      profile == AEAD_XCHACHA20_POLY1305_V1 inside parse_record_frame.
      Validate aad_len == AAD_LEN and compare the stored AAD bytes to
      the canonical AAD expected for the frame. Alternatively remove
      the stored AAD from the frame format if it is not intended to be
      authoritative.
    verification: >-
      Add tests that patch frame_version, the frame AEAD profile,
      aad_len, and stored AAD bytes while leaving ciphertext unchanged.
      Each case should fail before or during unlock or list instead of
