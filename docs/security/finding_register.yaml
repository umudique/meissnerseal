  - id: F-110
    kind: consistency
    component: test-vectors
    source: "test vector review — test-vectors/cross_verify.py (2026-07-03)"
    date: 2026-07-03
    description: >-
      cross_verify.py generate_aead_vectors() hardcodes the pre-rename
      arcanum-aad-v1 14-byte domain prefix and asserts len(aad) == 74.
      aead_xchacha20_v1.json was updated to 79-byte meissnerseal-aad-v1 AAD
      (F-56/F-57, version bumped to 2) but the generator was not. Running
      cross_verify.py aead overwrites the JSON with stale 74-byte values;
      git diff then detects the change and CI fails. The drift guard is
      working correctly but the broken generator makes it impossible to
      run a valid regeneration without first fixing generate_aead_vectors().
      The stale generator also produces vectors that do not match the
      canonical AAD enforced by the production implementation.
      Additionally, the generator returns "version": 1 while the JSON file
      is "version": 2 (updated manually for F-56/F-57), so running the
      generator causes a two-field diff (AAD prefix + version number).
