      NotImplementedError appends to skipped; any other exception appends
      to failed. After the loop, call sys.exit(1) if failed is non-empty
      or if skipped is non-empty and --allow-missing-deps was not passed.
      --allow-missing-deps must print a loud stderr warning and must not
      be used in CI. Update the ci-fast.yml step to remove the grep
      workaround (now redundant) and optionally add pipefail for
      belt-and-suspenders.
