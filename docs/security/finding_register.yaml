    component: meissnerseal-core
    source: "security review — crates/meissnerseal-core/src/item/store.rs (2026-06-30)"
    date: 2026-06-30
    description: >-
      with_item is generic over R and returns Result<R>, which allows a caller
      to clone label/tags or copy secret bytes inside the closure and return
      them as R, bypassing the intended closure-scoped plaintext lifecycle.
      PlainItemView holds borrowed references that cannot outlive the closure,
      but the return type R is unconstrained, so owned plaintext can escape.
      CONTRACT G-02 documents the invariant in prose but the type system does
      not enforce it.
    cwe: "CWE-312"
    severity: medium
    blocking: true
    status: resolved
    remediation: >-
      Change with_item to return Result<()> (non-escaping visitor), or
      constrain R to non-secret result types via a sealed marker trait.
      If a constrained return type is kept, document that with_item is an
      explicit plaintext extraction boundary and audit all call sites.
    verification: >-
      Add compile-fail tests showing that returning Vec<u8>, String, PlainItem,
      or SecretBytes from the closure is rejected. Add a positive test for a
      permitted non-secret return type such as usize or bool.
    commit: "17bbe3f"

